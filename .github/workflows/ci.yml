name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18.x", "22.x", "24.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # The suite needs node:test's beforeEach/afterEach (18.8+), so the declared runtime
  # floor gets a smoke run of the CLI itself.
  runtime-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "18.3.0"
      - name: Bundled CLI starts and keeps its exit codes
        run: |
          node skill/askaipods/scripts/askaipods.mjs --version
          node bin/askaipods.js --help > /dev/null
          set +e
          node skill/askaipods/scripts/askaipods.mjs > /dev/null 2>&1
          test $? -eq 1

  # Tags the version in package.json on a push to main. No tag or release for
  # a version whose tests fail: this job waits for every Node version in the
  # matrix and the runtime floor, run on the commit that would be tagged. It
  # runs on every push, so the push that fixes failing tests creates the tag.
  auto-tag:
    needs: [test, runtime-floor]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The tag is decided by what exists on the remote, not by comparing
      # package.json with the previous commit: a push that carries several
      # commits would hide a version bump made in any commit but the last.
      - name: Read version
        id: version
        run: echo "current=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # Two pushes close together can both find the tag (or release) missing.
      # The run that loses the race checks again and passes when the other
      # run has created it.
      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.current }}
        run: |
          tag_exists() { git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; }
          if tag_exists; then
            echo "Tag ${TAG} already exists"
          elif git tag "$TAG" && git push origin "$TAG"; then
            echo "Created tag ${TAG}"
          elif tag_exists; then
            echo "Tag ${TAG} was created by another run"
          else
            echo "Could not create tag ${TAG}" >&2
            exit 1
          fi

      - name: Create release
        env:
          TAG: ${{ steps.version.outputs.current }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_exists() { gh release view "$TAG" >/dev/null 2>&1; }
          if release_exists; then
            echo "Release ${TAG} already exists"
          elif gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes; then
            echo "Created release ${TAG}"
          elif release_exists; then
            echo "Release ${TAG} was created by another run"
          else
            echo "Could not create release ${TAG}" >&2
            exit 1
          fi
